services:
  gamarr:
    image: ghcr.io/pierre-vgr/gamarr:latest
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
      # Un seul montage "data" pour la bibliothèque ET les téléchargements qBittorrent
      # (./data/library et ./data/downloads) : un hardlink échoue entre deux montages
      # Docker distincts même s'ils pointent le même répertoire hôte, donc les deux
      # doivent être sous CE MÊME montage. Lecture-écriture requise (hardlink). Dans
      # qBittorrent, monte ce même dossier hôte et crée une catégorie dédiée dont le
      # chemin de sauvegarde est exactement "<montage>/downloads".
      #
      # Migration depuis l'ancien montage "./library:/library" : déplacer le contenu de
      # ./library vers ./data/library sur l'hôte avant de redémarrer avec cette version.
      - ./data:/data
    restart: unless-stopped
