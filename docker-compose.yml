services:
  gamarr:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ${GAMES_PATH:-./games}:/games:ro
    environment:
      - RAWG_API_KEY=${RAWG_API_KEY:-}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
    restart: unless-stopped
