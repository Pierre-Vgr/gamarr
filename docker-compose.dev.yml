services:
  gamarr:
    image: node:20-bookworm-slim
    working_dir: /app
    command: >
      sh -c "
        (cd backend && npm install && npm run dev) &
        (cd frontend && npm install && npm run dev) &
        wait
      "
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./config:/config
      - ./library:/library:ro
    ports:
      - "3000:3000"
      - "5173:5173"
